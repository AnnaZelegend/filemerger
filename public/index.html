<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Merger — Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e8e6;
    --panel:#ffffff;
    --ink:#1a1a1a;
    --ink-2:#6b6b69;
    --hair:#d3d3d0;
    --hair-2:#bcbcb8;
    --orange:#f2521b;
    --green:#1f9d57;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:48px 20px;
  }
  .unit{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--hair-2)}
  .top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:12px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--orange)}
  .brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .model{font-size:11px;font-weight:500;color:var(--ink-2);letter-spacing:.12em;text-transform:uppercase}

  .strip{padding:14px 22px;border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink-2);letter-spacing:-.005em}
  .body{padding:22px}

  .drop{
    border:1px solid var(--hair-2);background:#fafafa;
    padding:30px 20px;text-align:center;cursor:pointer;
    transition:background .12s,border-color .12s;
    position:relative;
  }
  .drop input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .drop:hover,.drop.over{background:#fff;border-color:var(--orange)}
  .plus{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px;line-height:1}
  .drop h2{margin:0 0 4px;font-size:15px;font-weight:600}
  .drop h2 u{color:var(--orange);text-decoration-thickness:1.5px;text-underline-offset:2px}
  .drop p{margin:0;font-size:11px;color:var(--ink-2);letter-spacing:.06em}

  .label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:24px 2px 10px}
  ul.items{list-style:none;margin:0;padding:0;border:1px solid var(--hair)}
  ul.items:empty{display:none}
  ul.items li{display:grid;grid-template-columns:26px 1fr auto 26px;align-items:center;gap:14px;padding:14px 14px;border-bottom:1px solid var(--hair);cursor:grab;user-select:none}
  ul.items li:last-child{border-bottom:0}
  ul.items li.dragging{opacity:.4}
  ul.items li.drag-over{border-top:2px solid var(--orange)}
  ul.items li:active{cursor:grabbing}
  .no{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:13px}
  .fn{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sz{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .x{width:22px;height:22px;border:1px solid var(--hair-2);background:#fff;cursor:pointer;font-size:12px;color:var(--ink-2);line-height:1;border-radius:2px;display:flex;align-items:center;justify-content:center}
  .x:hover{border-color:var(--orange);color:var(--orange)}

  .field{margin:24px 0 20px}
  .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
  .field .box{display:flex;align-items:center;border:1px solid var(--hair-2)}
  .field input{flex:1;border:0;padding:12px 14px;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);outline:none}
  .field input:focus{box-shadow:inset 0 0 0 2px rgba(242,82,27,.25)}
  .field .ex{font-size:13px;color:var(--ink-2);padding:0 14px;border-left:1px solid var(--hair);align-self:stretch;display:flex;align-items:center}

  .go{
    width:100%;border:0;cursor:pointer;background:var(--orange);color:#fff;
    font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.01em;padding:15px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:background .12s;
  }
  .go:disabled{opacity:.4;cursor:not-allowed}
  .go:disabled:hover{background:var(--orange)}
  .go:not(:disabled):hover{background:#d8420f}
  .go:not(:disabled):active{transform:translateY(1px)}
  .go.done{background:var(--green)}
  .go svg{width:16px;height:16px;flex-shrink:0}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .status{font-size:12px;color:var(--ink-2)}
  .status.err{color:var(--orange);font-weight:500}
  .gauge{display:flex;gap:4px}
  .gauge i{width:18px;height:5px;background:var(--hair-2);display:block;transition:background .2s}
  .gauge i.on{background:var(--orange)}
  .gauge i.done{background:var(--green)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:460px){ul.items li{grid-template-columns:22px 1fr auto 24px;gap:10px}}
</style>
</head>
<body>
  <section class="unit">
    <div class="top">
      <div class="brand"><span class="dot"></span><h1>File Merger</h1></div>
      <span class="model">PDF · OUT</span>
    </div>
    <div class="strip">Combine PDFs, images, Word docs, and text files into one PDF.</div>

    <div class="body">
      <label class="drop" id="drop">
        <input type="file" id="file-input" multiple aria-label="Add files"
          accept=".pdf,.jpg,.jpeg,.png,.webp,.tiff,.gif,.docx,.txt,.md,.csv">
        <div class="plus">+</div>
        <h2><u>Click to add files</u> or drag and drop</h2>
        <p>PDF · JPG · PNG · DOCX · TXT · CSV · MD</p>
      </label>

      <div class="label"><span>Files</span><span>Order = page order</span></div>
      <ul class="items" id="items"></ul>

      <div class="field">
        <label for="out">Output file name</label>
        <div class="box">
          <input id="out" value="merged" placeholder="merged">
          <span class="ex">.pdf</span>
        </div>
      </div>

      <button class="go" id="go" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        Merge &amp; download
      </button>
      <div class="foot">
        <span class="status" id="status">No files added</span>
        <span class="gauge" id="gauge"><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
  </section>

  <script>
    const fileInput = document.getElementById('file-input');
    const drop     = document.getElementById('drop');
    const itemsEl  = document.getElementById('items');
    const outEl    = document.getElementById('out');
    const goBtn    = document.getElementById('go');
    const statusEl = document.getElementById('status');
    const gaugeEl  = document.getElementById('gauge');
    const dots     = [...gaugeEl.querySelectorAll('i')];

    let files = [];
    let idCtr = 0;

    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function totalSize() {
      return files.reduce((s, e) => s + e.file.size, 0);
    }

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    function resetGauge(cls) {
      dots.forEach(d => { d.className = cls || ''; });
    }

    function updateFooter() {
      if (files.length === 0) {
        setStatus('No files added');
        resetGauge();
      } else {
        setStatus(files.length + ' file' + (files.length > 1 ? 's' : '') + ' · ' + fmtSize(totalSize()));
        resetGauge();
      }
    }

    function addFiles(newFiles) {
      for (const f of newFiles) files.push({ file: f, id: idCtr++ });
      render();
    }

    function render() {
      itemsEl.innerHTML = '';
      files.forEach((entry, i) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.id = entry.id;
        li.innerHTML =
          '<span class="no">' + (i + 1) + '</span>' +
          '<span class="fn" title="' + entry.file.name + '">' + entry.file.name + '</span>' +
          '<span class="sz">' + fmtSize(entry.file.size) + '</span>' +
          '<button class="x" aria-label="Remove">✕</button>';
        itemsEl.appendChild(li);
      });
      goBtn.disabled = files.length === 0;
      goBtn.classList.remove('done');
      goBtn.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>' +
        'Merge &amp; download';
      bindDrag();
      itemsEl.querySelectorAll('.x').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = Number.parseInt(btn.closest('li').dataset.id);
          files = files.filter(f => f.id !== id);
          render();
          updateFooter();
        });
      });
      updateFooter();
    }

    // Drag-to-reorder
    let dragSrcId = null;
    function bindDrag() {
      itemsEl.querySelectorAll('li').forEach(el => {
        el.addEventListener('dragstart', e => {
          dragSrcId = Number.parseInt(el.dataset.id);
          e.stopPropagation();
          setTimeout(() => el.classList.add('dragging'), 0);
        });
        el.addEventListener('dragend', () => el.classList.remove('dragging'));
        el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('drag-over'); });
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
        el.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          el.classList.remove('drag-over');
          const targetId = Number.parseInt(el.dataset.id);
          if (dragSrcId === targetId) return;
          const si = files.findIndex(f => f.id === dragSrcId);
          const ti = files.findIndex(f => f.id === targetId);
          const [item] = files.splice(si, 1);
          files.splice(ti, 0, item);
          render();
        });
      });
    }

    // File input
    fileInput.addEventListener('change', () => { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });

    // Drop zone
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('over');
      addFiles(Array.from(e.dataTransfer.files));
    });

    // Merge
    goBtn.addEventListener('click', async () => {
      if (files.length === 0 || goBtn.disabled) return;
      goBtn.disabled = true;
      goBtn.classList.remove('done');
      statusEl.className = 'status';
      setStatus('Merging…');

      // animate gauge
      resetGauge();
      let dotIdx = 0;
      const gaugeTimer = setInterval(() => {
        if (dotIdx < dots.length) dots[dotIdx++].classList.add('on');
      }, 200);

      const form = new FormData();
      for (const entry of files) form.append('files', entry.file, entry.file.name);
      form.append('outputName', outEl.value.trim() || 'merged');
      form.append('order', JSON.stringify(files.map(f => f.file.name)));

      try {
        const res = await fetch('/merge', { method: 'POST', body: form });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(err.error || res.statusText);
        }
        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        const name = (outEl.value.trim() || 'merged').replace(/\.pdf$/i, '') + '.pdf';
        a.href = url; a.download = name; a.click();
        URL.revokeObjectURL(url);

        clearInterval(gaugeTimer);
        dots.forEach(d => { d.classList.remove('on'); d.classList.add('done'); });
        goBtn.classList.add('done');
        goBtn.textContent = '✓ Downloaded';
        setStatus('Saved "' + name + '"');
      } catch (err) {
        clearInterval(gaugeTimer);
        resetGauge();
        setStatus('Error: ' + err.message, 'err');
        goBtn.disabled = false;
        goBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>' +
          'Merge &amp; download';
      }
    });
  </script>
</body>
</html>
